name: "⚠️ Problem bezpieczeństwa"
description: Błąd lub ryzyko, które może wpłynąć na bezpieczeństwo ludzi lub konstrukcji
title: "[BEZPIECZEŃSTWO] "
labels: ["bezpieczeństwo", "priorytet"]
body:
  - type: textarea
    id: opis
    attributes: {label: Opis problemu, description: Co jest nie tak i gdzie (plik, rysunek, obliczenie)?}
    validations: {required: true}
  - type: textarea
    id: skutki
    attributes: {label: Możliwe skutki}
    validations: {required: true}
  - type: textarea
    id: propozycja
    attributes: {label: Proponowane rozwiązanie (jeśli znasz)}
