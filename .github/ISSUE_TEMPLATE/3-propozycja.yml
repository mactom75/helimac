name: "💡 Propozycja zmiany / zadanie"
description: Nowe rozwiązanie, ulepszenie lub zadanie do wykonania
labels: ["propozycja"]
body:
  - type: dropdown
    id: obszar
    attributes:
      label: Obszar
      options: [Rama, Wirnik główny, Wirnik ogonowy, Przekładnia, Podwozie, Napęd, Bateria, Awionika, Oprogramowanie, Obliczenia, Przepisy, Dokumentacja, Inne]
    validations: {required: true}
  - type: textarea
    id: opis
    attributes: {label: Opis propozycji}
    validations: {required: true}
  - type: textarea
    id: uzasadnienie
    attributes: {label: Uzasadnienie (obliczenia, źródła, doświadczenie)}
